[package]
name = "vowifi-control"
version = "0.1.0"
edition = "2024"
# let-chains (edition 2024) need 1.88; install.sh builds with a rustup toolchain.
rust-version = "1.88"
description = "VoWiFi gateway control plane (manager + WebUI server)"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.9.2", features = ["tls-rustls-no-provider"] }
base64 = "0.22"
bytes = "1.12.1"
futures = "0.3.34"
hex = "0.4.3"
hmac = "0.12"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
indexmap = { version = "2.14.2", features = ["serde"] }
libloading = "0.9.0"
nix = { version = "0.31.3", features = ["net", "user", "signal", "process", "hostname"] }
pcsc = "2.9.0"
rand = "0.9"
rand_core06 = { version = "0.6", package = "rand_core", features = ["getrandom"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rsa = { version = "0.9", features = ["pem"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml = "0.9.34"
sha2 = "0.10"
socket2 = "0.6.5"
thiserror = "2.0.21"
time = "0.3"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
tracing = "0.1.44"
tracing-journald = "0.3"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"

[profile.release]
# One-time build on the host (also on Raspberry Pi class machines): favour a small, fast binary.
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"
